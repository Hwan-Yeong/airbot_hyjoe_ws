A1_perception:
  node:
    period_ms: 10
    climb_condition:
      pitch_alpha: 0.001
      enable_climbing_threshold: -1.15
      disable_climbing_threshold: -1.15
      timeout_ms: 1800
    inputs:
      robot_position:
        topic: "/amcl_pose"
        type: "PoseWithCovarianceStamped"
      camera_points:
        topic: "/sensor_to_pointcloud/camera_object"
        type: "PointCloud2"

    layers:
      camera_points:
        inputs:
        - "camera_points"
        filter:
          compose:
            filters:
              timeout:
                timeout_milliseconds: 60000
              sector_roi:
                use_inside: true
                delete_out_of_range: true
                use_when_climb: true
                min_range: 0.3
                max_range: 5.0
                min_angle: -180
                max_angle: 180
              density:
                max_count: 3
                radius: 0.2   