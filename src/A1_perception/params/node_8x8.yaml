A1_perception:
  node:
    period_ms: 10
    climb_condition:
      pitch_alpha: 0.001
      enable_climbing_threshold: -2.0
      disable_climbing_threshold: -2.0
      enable_down_climbing_threshold: 1.4
      disable_down_climbing_threshold: 1.4
      timeout_ms: 2000
    inputs:
      # "필수" [From nav2]
      robot_position:           
        topic: "/amcl_pose"
        type: "PoseWithCovarianceStamped"

      # "필수" [From everybot(mcu)]
      imu:
        topic: "/imu_data"
        type: "sensor_msgs/msg/Imu"

      # "필수" [From everybot(lidar)]
      lidar_pc_baselink: 
        topic: "/scan_merged_pointcloud"
        type: "PointCloud2"

      #[From everybot(sensor_manager)]
      collision: 
        topic: "/sensor_to_pointcloud/collision"
        type: "PointCloud2"
        
      #[From everybot(sensor_manager)]
      camera_points: 
        topic: "/sensor_to_pointcloud/camera_object"
        type: "PointCloud2"
      
      #[From everybot(sensor_manager)]
      one_d_tof:
        topic: "/sensor_to_pointcloud/tof/mono"
        type: "PointCloud2"

    #[From everybot(sensor_manager)]
    multi_tof_inputs:
      left: [
        0, 3, 6, 
        17, 20, 23, 
        28, 31,
        44, 47, 
        49, 52, 55, 
        57, 60, 63
      ]
      right: [
        1, 4, 7, 
        16, 19, 22, 
        24, 27,
        40, 43, 
        48, 51, 54, 
        56, 59, 62
      ]
      
    layers:
######## 1d / camera / collision
      one_d_tof:
        inputs:
        - "one_d_tof"
        filter:
          compose:
            filters:
              timeout:
                timeout_milliseconds: 60000
              lidar_dist_check:
                min_range: 0.0
                max_range: 0.1
              one_d_roi:
                use_inside: true
                use_when_climb: true
                delete_out_of_range: true
                delete_all_when_climb: false
                polygon: [ [0.6, -0.5], [0.6, 0.5], [0.18,0.5], [0.18,-0.50]]
              one_d_tof:
                use_stop: true
                use_when_climb: true
                delete_out_of_range: true
                delete_all_when_climb: false
                stop_and_back_dist: 0.33
                line_length: 0.10
                resolution: 0.05

      camera_points:
        inputs:
        - "camera_points"
        filter:
          compose:
            filters:
              timeout:
                timeout_milliseconds: 60000
              sector_roi:
                use_inside: true
                use_when_climb: true
                delete_out_of_range: true
                delete_all_when_climb: false
                min_range: 0.3
                max_range: 5.0
                min_angle: -180
                max_angle: 180
              density:
                max_count: 3
                radius: 0.2

      collision:
        inputs:
        - "collision"
        filter:
          compose:
            filters:
              collision:
                line_length: 0.25
                resolution: 0.05

      collision_tof_134_rows:
        inputs:
        - "multi_tof_left_idx_0"
        - "multi_tof_left_idx_3"
        - "multi_tof_left_idx_6"
        - "multi_tof_left_idx_17"
        - "multi_tof_left_idx_20"
        - "multi_tof_left_idx_23"
        - "multi_tof_left_idx_28"
        - "multi_tof_left_idx_31"
        - "multi_tof_right_idx_1"
        - "multi_tof_right_idx_4"
        - "multi_tof_right_idx_7"
        - "multi_tof_right_idx_16"
        - "multi_tof_right_idx_19"
        - "multi_tof_right_idx_22"
        - "multi_tof_right_idx_24"
        - "multi_tof_right_idx_27"
        filter:
          compose:
            filters:
              lidar_dist_check:
                min_range: 0.0
                max_range: 0.1
              collision_tof:
                use_data: true

