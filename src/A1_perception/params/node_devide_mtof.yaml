A1_perception:
  node:
    period_ms: 10
    climb_condition:
      pitch_alpha: 0.001
      enable_climbing_threshold: -1.15
      disable_climbing_threshold: -1.15
      timeout_ms: 1800
    inputs:
       # "필수" [From nav2]
      robot_position:           
        topic: "/amcl_pose"
        type: "PoseWithCovarianceStamped"

      # "필수" [From everybot(mcu)]
      imu:
        topic: "/imu_data"
        type: "sensor_msgs/msg/Imu"

      # "필수" [From everybot(lidar)]
      lidar_pc_baselink: 
        topic: "/scan_merged_pointcloud"
        type: "PointCloud2"

      #[From everybot(sensor_manager)]
      collision: 
        topic: "/sensor_to_pointcloud/collision"
        type: "PointCloud2"
        
      #[From everybot(sensor_manager)]
      camera_points: 
        topic: "/sensor_to_pointcloud/camera_object"
        type: "PointCloud2"
      
      #[From everybot(sensor_manager)]
      one_d_tof:
        topic: "/sensor_to_pointcloud/tof/mono"
        type: "PointCloud2"

    #[From everybot(sensor_manager)]
    multi_tof_inputs:
      left: [
        1, 4, 7, 17,
        20, 23, 28, 31,
        44, 47, 49, 52,
        55, 57, 60, 63
      ]
      right: [
        0, 3, 6, 16,
        19, 22, 24, 27,
        40, 43, 48, 51,
        54, 56, 59, 62
      ]
    
######## M-Tof persistence(1~6rows)

      multi_tof_13rows:
        inputs:
        - "multi_tof_left_idx_1"
        - "multi_tof_left_idx_4"
        - "multi_tof_left_idx_7"
        - "multi_tof_left_idx_17"
        - "multi_tof_left_idx_20"
        - "multi_tof_left_idx_23"
        - "multi_tof_right_idx_0"
        - "multi_tof_right_idx_3"
        - "multi_tof_right_idx_6"
        - "multi_tof_right_idx_16"
        - "multi_tof_right_idx_19"
        - "multi_tof_right_idx_22"
        filter:
          compose:
            filters:
              timeout:
                timeout_milliseconds: 15000
              lidar_dist_check:
                min_range: 0.0
                max_range: 0.15
              sector_roi:
                use_inside: true
                delete_out_of_range: true
                use_when_climb: true
                min_range: 0.9
                max_range: 2.5
                min_angle: -160
                max_angle: 160
              density:
                max_count: 3
                radius: 0.3

      multi_tof_4rows:
        inputs:
        - "multi_tof_left_idx_28"
        - "multi_tof_left_idx_31"
        - "multi_tof_right_idx_24"
        - "multi_tof_right_idx_27"
        filter:
          compose:
            filters:
              timeout:
                timeout_milliseconds: 15000
              lidar_dist_check:
                min_range: 0.0
                max_range: 0.15
              sector_roi:
                use_inside: true
                delete_out_of_range: true
                use_when_climb: true
                min_range: 0.4
                max_range: 0.9
                min_angle: -160
                max_angle: 160
              density:
                max_count: 3
                radius: 0.3

      multi_tof_left_6rows:
        inputs:
        - "multi_tof_left_idx_44"
        - "multi_tof_left_idx_47"
        filter:
          compose:
            filters:
              lidar_dist_check:
                min_range: 0.0
                max_range: 0.15
              sector_roi:
                use_inside: true
                delete_out_of_range: false
                min_range: 0.3 #0.5
                max_range: 0.75 #0.9
                min_angle: -160
                max_angle: 160
              density:
                max_count: 2
                radius: 0.05

      multi_tof_right_6rows:
        inputs:
        - "multi_tof_right_idx_40"
        - "multi_tof_right_idx_43"
        filter:
          compose:
            filters:
              lidar_dist_check:
                min_range: 0.0
                max_range: 0.15
              sector_roi:
                use_inside: true
                delete_out_of_range: false
                min_range: 0.3 #0.5
                max_range: 1.05 #0.9
                min_angle: -160
                max_angle: 160
              density:
                max_count: 2
                radius: 0.05

######## M-Tof real time(1~6rows)
      multi_tof_13rows_realtime:
        inputs:
        - "multi_tof_left_idx_1"
        - "multi_tof_left_idx_4"
        - "multi_tof_left_idx_7"
        - "multi_tof_left_idx_17"
        - "multi_tof_left_idx_20"
        - "multi_tof_left_idx_23"
        - "multi_tof_right_idx_0"
        - "multi_tof_right_idx_3"
        - "multi_tof_right_idx_6"
        - "multi_tof_right_idx_16"
        - "multi_tof_right_idx_19"
        - "multi_tof_right_idx_22"
        filter:
          compose:
            filters:
              timeout:
                timeout_milliseconds: 100
              lidar_dist_check:
                min_range: 0.0
                max_range: 0.15
              sector_roi:
                use_inside: true
                delete_out_of_range: true
                use_when_climb: true
                min_range: 0.3
                max_range: 0.9
                min_angle: -50.3
                max_angle: 50.3
              density:
                max_count: 3
                radius: 0.1

      multi_tof_4rows_realtime:
        inputs:
        - "multi_tof_left_idx_28"
        - "multi_tof_left_idx_31"
        - "multi_tof_right_idx_24"
        - "multi_tof_right_idx_27"
        filter:
          compose:
            filters:
              timeout:
                timeout_milliseconds: 100
              lidar_dist_check:
                min_range: 0.0
                max_range: 0.15
              sector_roi:
                use_inside: true
                delete_out_of_range: true
                use_when_climb: true
                min_range: 0.3
                max_range: 0.4
                min_angle: -50.3
                max_angle: 50.3
              density:
                max_count: 3
                radius: 0.1
