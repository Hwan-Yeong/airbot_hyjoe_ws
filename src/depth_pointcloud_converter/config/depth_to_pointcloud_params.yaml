# depth_to_pointcloud_node parameters
#
# '/**' 로 두면 노드 이름/네임스페이스에 관계없이 적용된다.
# launch 에서 이 파일을 parameters 로 넘겨 share 에서 bringup 한다.
/**:
  ros__parameters:
    # ---- 토픽 ----
    depth_topic: "/camera/depth/image_raw"        # 입력 depth (sensor_msgs/Image, 16UC1, mm)
    camera_info_topic: "/camera/depth/camera_info"
    output_topic: "/camera/depth/points"          # 출력 PointCloud2

    # ---- 프레임 ----
    # 비우면("") depth 이미지 header.frame_id(inusensor_depth, 광학 좌표계)를 그대로 사용한다.
    output_frame: ""

    # ---- 변환 ----
    depth_scale: 0.001     # 16UC1(mm) -> m
    range_min: 0.1         # 유효 최소 거리 [m]
    range_max: 5.0         # 유효 최대 거리 [m]
    row_step: 1            # 행 다운샘플 (1 = 전체 해상도)
    col_step: 1            # 열 다운샘플 (1 = 전체 해상도)

    # ---- 발행 ----
    publish_rate_hz: 15.0          # timer 변환·발행 주기 [Hz]
    output_reliability: "reliable" # "reliable" | "best_effort" (RViz 기본값은 reliable)
