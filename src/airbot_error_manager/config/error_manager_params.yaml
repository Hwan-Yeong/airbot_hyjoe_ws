airbot_error_manager:
  ros__parameters:
    log_print: true
    # 0: unset, 10: debug, 20: info, 30: warn, 40: error
    log_level: 20
    publish_rate_ms: 1000
    error_publish_cnt: 1 # 에러 발생/해제 메시지 퍼블리싱 횟수 (to UDP_interface)
    error_list_size: 28 # 관리할 에러 리스크 최대 크기
    error_list: error_list.yaml

airbot_error_monitor:
  ros__parameters:
    low_battery_error:
      monitoring_rate_ms: 1000
      occur:
        battery_percentage_min: 5
        battery_percentage_max: 15
      resolve:
        battery_percentage_th: 28
        duration_sec: 30.0

    discharging_error:
      monitoring_rate_ms: 1000
      occur:
        battery_percentage_min: 0
        battery_percentage_max: 5
        duration_sec: 10.0
      resolve:
        battery_percentage_th: 10
        duration_sec: 30.0

    board_overheat_error:
      monitoring_rate_ms: 1000
      occur:
        temperature_th_c: 85.0
        duration_sec: 30.0

    charging_error:
      monitoring_rate_ms: 1000
      occur:
        battery_percentage_min_th: 1
        battery_percentage_max_th: 60
        battery_percentage_diff_th: 2
        duration_sec: 1200.0

    fall_down_error:
      monitoring_rate_ms: 1000
      occur:
        drop_ir_adc_th: 900
        drop_ir_cnt_min: 4
        imu_roll_th_deg: 60.0
        imu_pitch_th_deg: 60.0

    lift_error:
      monitoring_rate_ms: 10
      occur:
        drop_ir_adc_th: 900
        drop_ir_cnt_min: 4
        imu_z_acc_low_th: 9.2
        imu_z_acc_hight_th: 10.5

    cliff_error:
      monitoring_rate_ms: 10
      occur:
        accum_dist_th_m: 0.3

    one_d_tof_error:
      monitoring_rate_ms: 50
      occur:
        duration_sec: 60.0
        one_d_min_dist_m: 0.03
        one_d_max_dist_m: 0.13

    ai_comm_error:
      monitoring_rate_ms: 1000
      occur:
        duration_cnt_first_sec: 180
        duration_cnt_sec: 3

    # battery_overheat_error:
    #   monitoring_rate_ms: 1000
    #   occur:
    #     high_temp_th: 45 # Fan 구동 시작 온도
    #   resolve:
    #     low_temp_th: 40 # Fan 구동 멈춤 온도
    #     duration_sec: 10.0 # 사용 X