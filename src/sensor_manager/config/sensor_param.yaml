#
#        00: 케이블
#        01: 카펫
#        02: 옷, 수건, 양말
#        03: 액체
#        04: 비장애물
#        05: 장애물
#        06: 동물 대변
#        07: 체중계
#        08: 문턱
#        09: 사람
#        10: 개
#        11: 고양이
#        12: 의자
