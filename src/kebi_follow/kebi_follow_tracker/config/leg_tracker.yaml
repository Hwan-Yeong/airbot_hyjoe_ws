# leg_tracker 파라미터 (docs/SPEC.md 6.2). 코드 기본값(include/kebi_follow_tracker/params.hpp)과
# 같아야 한다 (test_config 가 이 파일과 leg_tracker.advanced.yaml 을 합쳐 확인). 실수형은 소수점을 붙인다 (정수로 읽히면 ROS 가 거부한다).
# 분류기·칼만·연관·트랙 수명 같은 알고리즘 내부값은 leg_tracker.advanced.yaml 에 있다 (launch 가 먼저 읽는다).
# tunables.hpp 의 13개는 실행 중 바꿀 수 있다 (튜닝 화면의 leg_tracker/...).
leg_tracker:
  ros__parameters:
    # ================================================================ 핵심 (타깃 고정·모호 판정)
    acquire:                      # mode ACQUIRE, SPEC 6.2: 앞에 선, 카메라로 확인된 사람 1명이 confirm_s 동안 유지되면 고정
      require_camera: true
      min_range: 0.5              # [m]
      max_range: 1.5
      max_bearing_deg: 20.0
      confirm_s: 1.0              # [s]
    ambiguity:                    # SPEC 6.2: 타깃 이 반경 안에 사람 같은 다른 트랙이 있으면 모호 → controller WAITING
      radius: 0.6                 # [m]
      min_person_score: 0.5
      lost_s: 0.0                 # [실험, 기본 꺼짐] [s] >0: 모호가 이만큼 계속되면 LOST, 모호 직전 위치에서 재획득 (기본 끔)

    # ================================================================ 동작 (현장 조정)
    camera:                       # cam_legs 융합
      gate: 0.4                   # [m] SPEC 6.2
      person_weight: 0.6          # person_score = 1 - (1 - 형상) * (1 - w * 카메라)
      group_legs_with_person: true  # 한 사람 검출(사람 + 그 다리)은 트랙 하나만 확인 (거짓 모호 방지)
    target:                       # mode TRACK, SPEC 6.2
      lost_s: 2.0                 # [s]
      reacquire_radius: 1.0       # [m]
      reacquire_confirm_s: 0.5    # [s]
      camera_lost_s: 3.0          # [s] 카메라가 살아 있는데 확인 영역 안 타깃을 이만큼 못 보면 LOST (0: 끔)

    # ================================================================ 로봇
    scan:
      robot_radius: 0.22          # [m] SPEC 3절
      body_margin: 0.05           # [m] 반경 + 여유 안의 점은 로봇 몸체

    # ================================================================ 배관 (토픽·좌표계·진단)
    odom_frame: odom
    base_frame: base_link
    scan_topic: /scan
    cam_legs_topic: /kebi_follow/cam_legs
    mode_topic: /kebi_follow/mode
    target_topic: /kebi_follow/target
    tracks_topic: /kebi_follow/tracks
    markers_topic: /kebi_follow/leg_tracker/markers
    publish_markers: true
    tf_tolerance_s: 0.05          # [s] scan stamp 가 최신 TF 보다 이만큼 늦으면 최신 TF 를 쓴다
    timing_log_period_s: 60.0     # [s] 처리 시간 로그 주기 (0: 끔)
    initial_mode: 0               # 시험용: 0 OFF, 1 ACQUIRE, 2 TRACK (보통 controller 가 정한다)
